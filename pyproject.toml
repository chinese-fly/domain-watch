[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwatch"
version = "1.0.0"
description = "Look-alike domain monitoring with history, scoring and diffs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["typosquatting", "osint", "dns", "brand-protection", "monitoring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
]

[project.scripts]
dwatch = "dwatch.cli:main"

[tool.setuptools]
packages = ["dwatch"]
